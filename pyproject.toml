[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zworkbench"
version = "0.1.0"
description = "Personal workbench composition owner"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
zworkbench = "zworkbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Requires pytest >= 7: the pythonpath ini option does not exist before that.
# Product behaviour tests live in tests/. evaluation/fixtures and
# evaluation/evidence contain fixture tests that import packages installed
# only inside their runners' isolated environments; collecting them from the
# repo root fails imports that are not product failures.
testpaths = ["tests"]
pythonpath = ["src", "."]

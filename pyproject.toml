[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zworkbench"
version = "0.1.0"
description = "Personal workbench composition owner"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
zworkbench = "zworkbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
